services:
  - type: web
    name: caisse-halloween
    env: static
    buildCommand: cd apps/application-de-caisse-du-club-de-football && npm ci && npm run build
    publishPath: apps/application-de-caisse-du-club-de-football/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
